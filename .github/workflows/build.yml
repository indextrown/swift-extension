# main 브랜치 푸시와 모든 PR에서 패키지가 빌드되는지 확인합니다.
#
# Debug와 Release 두 구성을 각각 빌드합니다. Release 구성은 최적화를 켠
# 상태에서만 드러나는 컴파일 오류를 잡기 위해 함께 확인합니다.

name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - debug
          - release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build -c ${{ matrix.configuration }}
